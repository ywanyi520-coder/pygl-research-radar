[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "pygl-research-radar"
version = "1.0.0"
description = "Evidence-aware daily biomedical literature radar for PYGL research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0,<7",
  "pypdf>=5.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.scripts]
pygl-radar = "pygl_radar.__main__:main"

[tool.setuptools.packages.find]
include = ["pygl_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
