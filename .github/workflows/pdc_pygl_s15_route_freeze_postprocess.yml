name: CPTAC PYGL S15 route-freeze artifact completion

on:
  workflow_run:
    workflows:
      - CPTAC PYGL S15 patient mapping and route freeze
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  complete-artifact:
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out audit code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependency
        run: python -m pip install requests
      - name: Download S15 scan and mapping inputs from the route run
        uses: actions/download-artifact@v4
        with:
          name: pdc-pygl-s15-route-freeze
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: remote_results
      - name: Download the frozen S15-confirmed input artifact
        uses: actions/download-artifact@v4
        with:
          name: pdc-pygl-s15-remote-audit
          repository: ${{ github.repository }}
          run-id: 37566261402
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: remote_input/previous
      - name: Regenerate endpoint inventory and complete route outputs
        env:
          S15_INPUT_ROOT: remote_input/previous
        run: python remote_audit/s15_route_freeze.py
      - name: Upload complete temporary route-freeze artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdc-pygl-s15-route-freeze-complete
          path: |
            remote_results/S15_*
            remote_results/BRCA_*.tsv
          if-no-files-found: warn
          retention-days: 14
