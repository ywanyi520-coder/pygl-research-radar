name: Remove incomplete PYGL S15 recovery artifact

on:
  workflow_run:
    workflows:
      - CPTAC PYGL S15 targeted route-freeze recovery
    types: [completed]
    branches: [main]

permissions:
  actions: write

jobs:
  remove-incomplete-artifact:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the artifact from this unsuccessful recovery run
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const { owner, repo } = context.repo;
            const result = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: runId
            });
            const targets = result.data.artifacts.filter(
              artifact => artifact.name === "pdc-pygl-s15-route-freeze-recovery"
            );
            for (const artifact of targets) {
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: artifact.id
              });
              core.info(`Deleted incomplete recovery artifact ${artifact.id}`);
            }
