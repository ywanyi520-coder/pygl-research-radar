name: Clean temporary PYGL S15 recovery artifacts

on:
  workflow_run:
    workflows:
      - CPTAC PYGL S15 targeted route-freeze recovery
    types: [completed]
    branches: [main]

permissions:
  actions: write

jobs:
  clean-temporary-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only obsolete artifacts from this recovery run
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const succeeded = context.payload.workflow_run.conclusion === "success";
            const targetName = succeeded
              ? "pdc-pygl-s15-route-scan-stage"
              : "pdc-pygl-s15-route-freeze-recovery";
            const { owner, repo } = context.repo;
            const result = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: runId
            });
            const targets = result.data.artifacts.filter(
              artifact => artifact.name === targetName
            );
            for (const artifact of targets) {
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: artifact.id
              });
              core.info(`Deleted obsolete recovery artifact ${artifact.id}`);
            }
