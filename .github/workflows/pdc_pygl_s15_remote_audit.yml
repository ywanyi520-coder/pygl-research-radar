name: CPTAC Pan-Cancer PYGL S15 remote audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out audit code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install requests pandas openpyxl
      - name: Run remote PDC audit
        run: python remote_audit/audit_pdc_pancancer.py
      - name: Upload compact audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdc-pygl-s15-remote-audit
          path: remote_results/
          if-no-files-found: warn
          retention-days: 14

