name: Non-CPTAC PYGL S15 clinical cohort audit

on:
  push:
    branches: [audit/noncptac-pygl-s15]
    paths:
      - .github/workflows/noncptac_pygl_s15_clinical_audit.yml
      - remote_audit/noncptac_pygl_s15_clinical_audit.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/noncptac-pygl-s15
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public-data client and table reader
        run: python -m pip install --upgrade requests openpyxl pridepy
      - name: Inventory public processed files and scan PYGL S15
        run: python remote_audit/noncptac_pygl_s15_clinical_audit.py
      - name: Commit audit tables to the isolated branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/NonCPTAC_S15_*.tsv results/NonCPTAC_S15_audit_status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record non-CPTAC PYGL S15 audit results"
            git push origin HEAD:audit/noncptac-pygl-s15
          fi
      - name: Upload audit results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noncptac-pygl-s15-audit
          path: |
            results/NonCPTAC_S15_*
            remote_audit_data/
          if-no-files-found: warn
          retention-days: 30

